data_sources:
  tushare:
    base_url: "http://datahubco.com/app-api/openapi/v1/tushare"
    token_env: "TUSHARE_API_KEY"
    request_interval_seconds: 1.0
    page_size: 5000

market:
  sw_source: "SW2021"
  industry_level: "L1"
  benchmark_index: "000300.SH"
  benchmark_name: "沪深300"
  default_lookback_days: 120
  comparison_industries:
    - "电子"
    - "通信"
    - "汽车"
    - "医药生物"
    - "银行"

scoring:
  weights:
    price_trend_score: 0.50
    heat_score: 0.20
    etf_score: 0.15
    sentiment_score: 0.15

etf_history:
  lookback_days: 180
  max_etfs_per_industry: 1

style_groups:
  科技成长:
    - "电子"
    - "通信"
    - "计算机"
    - "传媒"
    - "国防军工"
  高端制造:
    - "电力设备"
    - "机械设备"
    - "汽车"
    - "国防军工"
  消费医药:
    - "食品饮料"
    - "医药生物"
    - "家用电器"
    - "社会服务"
    - "商贸零售"
  周期资源:
    - "有色金属"
    - "煤炭"
    - "钢铁"
    - "基础化工"
    - "石油石化"
    - "建筑材料"
  金融地产:
    - "银行"
    - "非银金融"
    - "房地产"
  稳定防御:
    - "公用事业"
    - "交通运输"
    - "农林牧渔"

style_index_codes:
  大盘（沪深300）: "000300.SH"
  中小盘（中证500）: "000905.SH"
  高股息（上证红利）: "000015.SH"
  科创成长（科创50）: "000688.SH"

